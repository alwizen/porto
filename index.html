<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTHING</title>
    <link rel="icon" type="image/x-icon" href="./src/fav.ico">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #02010a;
            /* Custom star cursor */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M16 1l4.2 9.8L30 15l-9.8 4.2L16 29l-4.2-9.8L2 15l9.8-4.2z' fill='%23ffffff' stroke='%23ffde59' stroke-width='1.5'/></svg>") 16 16, auto;
        }

        a, button, .nothing {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M16 1l4.2 9.8L30 15l-9.8 4.2L16 29l-4.2-9.8L2 15l9.8-4.2z' fill='%23ffde59' stroke='%23ff3131' stroke-width='1.5'/></svg>") 16 16, pointer;
        }

        /* ==== Space background layers ==== */
        .space {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(88, 28, 135, 0.45), transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(30, 64, 175, 0.40), transparent 55%),
                radial-gradient(ellipse at 55% 90%, rgba(190, 24, 93, 0.28), transparent 60%),
                linear-gradient(180deg, #02010a 0%, #050214 50%, #010007 100%);
        }

        /* Slow drifting nebula clouds */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            mix-blend-mode: screen;
        }

        .nebula.a {
            width: 60vmax;
            height: 60vmax;
            top: -20vmax;
            left: -15vmax;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.75), transparent 70%);
            animation: drift1 40s ease-in-out infinite alternate;
        }

        .nebula.b {
            width: 50vmax;
            height: 50vmax;
            bottom: -18vmax;
            right: -12vmax;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.7), transparent 70%);
            animation: drift2 52s ease-in-out infinite alternate;
        }

        .nebula.c {
            width: 45vmax;
            height: 45vmax;
            top: 35%;
            left: 45%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.45), transparent 70%);
            animation: drift3 64s ease-in-out infinite alternate;
        }

        @keyframes drift1 {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(12vw, 10vh, 0) scale(1.25); }
        }
        @keyframes drift2 {
            from { transform: translate3d(0, 0, 0) scale(1.15); }
            to   { transform: translate3d(-14vw, -8vh, 0) scale(0.9); }
        }
        @keyframes drift3 {
            from { transform: translate3d(-6vw, 6vh, 0) scale(0.95); }
            to   { transform: translate3d(8vw, -10vh, 0) scale(1.2); }
        }

        /* Star layers (twinkling) */
        .stars,
        .stars2,
        .stars3 {
            position: absolute;
            inset: -50%;
            background-repeat: repeat;
            will-change: transform, opacity;
        }

        .stars {
            background-image:
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 120px 80px, #cbd5ff, transparent),
                radial-gradient(1px 1px at 200px 150px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 300px 60px, #ffe9c4, transparent),
                radial-gradient(1px 1px at 380px 210px, #fff, transparent);
            background-size: 420px 260px;
            animation: twinkle 5s ease-in-out infinite, pan 240s linear infinite;
        }

        .stars2 {
            background-image:
                radial-gradient(2px 2px at 60px 120px, #ffffff, transparent),
                radial-gradient(2.5px 2.5px at 260px 40px, #bcd2ff, transparent),
                radial-gradient(1.8px 1.8px at 160px 220px, #fff, transparent),
                radial-gradient(2px 2px at 340px 160px, #ffd9ec, transparent);
            background-size: 520px 360px;
            animation: twinkle 7s ease-in-out infinite reverse, pan 360s linear infinite reverse;
            opacity: 0.9;
        }

        .stars3 {
            background-image:
                radial-gradient(3px 3px at 90px 60px, #ffffff, transparent),
                radial-gradient(3.5px 3.5px at 300px 200px, #a5c8ff, transparent);
            background-size: 700px 500px;
            animation: twinkle 9s ease-in-out infinite, pan 520s linear infinite;
            filter: blur(0.4px);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        @keyframes pan {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(-420px, -260px, 0); }
        }

        /* Shooting star */
        .shooting {
            position: absolute;
            top: 15%;
            left: -10%;
            width: 160px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff);
            border-radius: 999px;
            filter: drop-shadow(0 0 6px #fff);
            opacity: 0;
            transform: rotate(20deg);
            animation: shoot 8s ease-in 3s infinite;
        }

        .shooting.two {
            top: 55%;
            left: -10%;
            animation: shoot 12s ease-in 7s infinite;
            width: 120px;
        }

        @keyframes shoot {
            0%   { transform: translate3d(0, 0, 0) rotate(20deg); opacity: 0; }
            5%   { opacity: 1; }
            25%  { transform: translate3d(120vw, 45vh, 0) rotate(20deg); opacity: 0; }
            100% { transform: translate3d(120vw, 45vh, 0) rotate(20deg); opacity: 0; }
        }

        /* ==== Hero ==== */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .nothing {
            position: relative;
            z-index: 1;
            font-size: min(16vw, 20rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 0 24px rgba(255, 255, 255, 0.28), 0 0 60px rgba(147, 51, 234, 0.4);
            user-select: none;
            animation: float 6s ease-in-out infinite;
            white-space: nowrap;
            padding: 0 2vw;
        }

        /* Full-width continuous red strike-through line */
        .nothing::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: clamp(3px, 1.1vw, 14px);
            background: #ff3131;
            box-shadow: 0 0 18px rgba(255, 49, 49, 0.7);
            z-index: 2;
            pointer-events: none;
        }

        /* Lottie background behind the text */
        .hero-lottie {
            position: absolute;
            inset: 0;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0.9;
        }

        .hero-lottie dotlottie-wc {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 900px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .stars, .stars2, .stars3, .nebula, .shooting, .nothing {
                animation: none !important;
            }
        }

        /* ==== Glowing star cursor trail ==== */
        .cursor-star {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            pointer-events: none;
            z-index: 9999;
            background: radial-gradient(circle, #ffffff 0%, #ffde59 45%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 222, 89, 0.9), 0 0 20px rgba(147, 51, 234, 0.7);
            transform: translate(-100px, -100px);
        }

        .cursor-star::before {
            content: '';
            position: absolute;
            inset: 0;
            margin: auto;
            width: 14px;
            height: 14px;
            background: rgba(255, 255, 255, 0.6);
            clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
            animation: spinStar 3s linear infinite;
        }

        @keyframes spinStar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @media (pointer: coarse) {
            .cursor-star { display: none; }
            body, a, button, .nothing { cursor: auto; }
        }
    </style>
</head>
<body>
    <!-- Animated space background -->
    <div class="space" aria-hidden="true">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
        <div class="nebula a"></div>
        <div class="nebula b"></div>
        <div class="nebula c"></div>
        <div class="shooting"></div>
        <div class="shooting two"></div>
    </div>

    <section class="hero">
        <div class="hero-lottie" aria-hidden="true">
            <dotlottie-wc src="https://lottie.host/d289b154-6561-4237-95a1-48e41e8a8959/DIMza7h9pb.lottie" autoplay loop></dotlottie-wc>
        </div>
        <h1 class="nothing">NOTHING</h1>
    </section>

    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js" type="module"></script>

    <!-- Glowing star cursor -->
    <div class="cursor-star" aria-hidden="true"></div>

    <script>
        (function () {
            var star = document.querySelector('.cursor-star');
            if (!star) return;

            var x = window.innerWidth / 2;
            var y = window.innerHeight / 2;
            var curX = x, curY = y;

            window.addEventListener('mousemove', function (e) {
                x = e.clientX;
                y = e.clientY;
            }, { passive: true });

            function loop() {
                // Smooth follow (lerp)
                curX += (x - curX) * 0.18;
                curY += (y - curY) * 0.18;
                star.style.transform = 'translate(' + curX + 'px,' + curY + 'px)';
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
